name: RunseMac
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: 3
  configs:
    Release:
      # Strip the get-task-allow entitlement so Release builds can be
      # notarized straight from `xcodebuild build` (without going through
      # archive/export).
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      # Hardened Runtime is required for Developer ID notarization.
      ENABLE_HARDENED_RUNTIME: YES
configFiles:
  Debug: Config/Local.example.xcconfig
  Release: Config/Local.example.xcconfig
targets:
  RunseCore:
    type: framework
    platform: macOS
    sources:
      - RunseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.runse.mac.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
  RunseMac:
    type: application
    platform: macOS
    sources:
      - RunseMac
    dependencies:
      - target: RunseCore
    info:
      path: RunseMac/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleDisplayName: Runse
        CFBundleName: Runse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DefaultNVIDIAAPIKeyObfuscated: $(DEFAULT_NVIDIA_API_KEY_OBFUSCATED)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
        NSServices:
          - NSMenuItem:
              default: Runse Refine Text
            NSMessage: refineText
            NSPortName: Runse
            NSSendTypes:
              - NSStringPboardType
              - NSRTFPboardType
              - NSRTFDPboardType
              - NSPasteboardTypeString
              - NSPasteboardTypeRTF
              - NSPasteboardTypeRTFD
              - public.utf8-plain-text
              - public.utf16-plain-text
              - public.plain-text
              - public.text
              - public.rtf
              - com.apple.flat-rtfd
              - public.html
              - NSHTMLPboardType
              - NSPasteboardTypeHTML
          - NSMenuItem:
              default: Runse Translate Text
            NSMessage: translateText
            NSPortName: Runse
            NSSendTypes:
              - NSStringPboardType
              - NSRTFPboardType
              - NSRTFDPboardType
              - NSPasteboardTypeString
              - NSPasteboardTypeRTF
              - NSPasteboardTypeRTFD
              - public.utf8-plain-text
              - public.utf16-plain-text
              - public.plain-text
              - public.text
              - public.rtf
              - com.apple.flat-rtfd
              - public.html
              - NSHTMLPboardType
              - NSPasteboardTypeHTML
          - NSMenuItem:
              default: Runse Pinyin
            NSMessage: pinyinText
            NSPortName: Runse
            NSSendTypes:
              - NSStringPboardType
              - NSRTFPboardType
              - NSRTFDPboardType
              - NSPasteboardTypeString
              - NSPasteboardTypeRTF
              - NSPasteboardTypeRTFD
              - public.utf8-plain-text
              - public.utf16-plain-text
              - public.plain-text
              - public.text
              - public.rtf
              - com.apple.flat-rtfd
              - public.html
              - NSHTMLPboardType
              - NSPasteboardTypeHTML
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.runse.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RunseMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RunseMacTests
    dependencies:
      - target: RunseMac
      - target: RunseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.runse.mac.tests
        GENERATE_INFOPLIST_FILE: YES
  RunseMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - RunseMacUITests
    dependencies:
      - target: RunseMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.runse.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RunseMac:
    build:
      targets:
        RunseMac: all
        RunseMacTests: [test]
        RunseMacUITests: [test]
    test:
      targets:
        - RunseMacTests
        - RunseMacUITests
